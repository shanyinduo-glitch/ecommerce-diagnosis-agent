[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-diagnosis-agent"
version = "0.1.0"
description = "Evidence-based ecommerce diagnosis with Qwen and LangChain"
requires-python = ">=3.12"
dependencies = ["langchain-openai>=1,<2", "pandas>=2,<4", "matplotlib>=3.8,<4"]

[project.scripts]
ecommerce-agent = "ecommerce_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
